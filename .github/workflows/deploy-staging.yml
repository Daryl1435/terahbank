name: Deploy to Staging

on:
  push:
    branches: [staging]

env:
  AWS_REGION: af-south-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.af-south-1.amazonaws.com
  ECS_CLUSTER: terahbank-staging

jobs:
  deploy-api:
    name: Build + Deploy API → Staging ECS
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API Docker image
        run: |
          IMAGE_TAG=staging-${{ github.sha }}
          docker build -t terahbank-api ./apps/api
          docker tag terahbank-api:latest $ECR_REGISTRY/terahbank-api:$IMAGE_TAG
          docker tag terahbank-api:latest $ECR_REGISTRY/terahbank-api:staging-latest
          docker push $ECR_REGISTRY/terahbank-api:$IMAGE_TAG
          docker push $ECR_REGISTRY/terahbank-api:staging-latest
          echo "IMAGE=$ECR_REGISTRY/terahbank-api:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Run DB migrations on staging
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster $ECS_CLUSTER \
            --task-definition terahbank-migration \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.STAGING_SUBNET_ID }}],securityGroups=[${{ secrets.STAGING_SG_ID }}]}" \
            --overrides '{"containerOverrides":[{"name":"api","command":["alembic","upgrade","head"]}]}' \
            --query 'tasks[0].taskArn' --output text)
          echo "Migration task: $TASK_ARN"
          aws ecs wait tasks-stopped --cluster $ECS_CLUSTER --tasks $TASK_ARN
          EXIT_CODE=$(aws ecs describe-tasks --cluster $ECS_CLUSTER --tasks $TASK_ARN \
            --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$EXIT_CODE" != "0" ]; then echo "Migration failed"; exit 1; fi

      - name: Update ECS service with new image
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service terahbank-api \
            --force-new-deployment
          aws ecs wait services-stable \
            --cluster $ECS_CLUSTER \
            --services terahbank-api

      - name: Smoke test staging API
        run: |
          curl -f https://api.staging.terahbank.com/api/v1/health || exit 1

  deploy-web:
    name: Deploy Web + Admin → Vercel Staging
    runs-on: ubuntu-latest
    environment: staging
    needs: deploy-api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy web to Vercel (staging)
        run: |
          cd apps/web && npm ci
          npx vercel deploy --token ${{ secrets.VERCEL_TOKEN }} --env NEXT_PUBLIC_API_URL=https://api.staging.terahbank.com

      - name: Deploy admin to Vercel (staging)
        run: |
          cd apps/admin && npm ci
          npx vercel deploy --token ${{ secrets.VERCEL_TOKEN }} --env NEXT_PUBLIC_API_URL=https://api.staging.terahbank.com

  e2e-tests:
    name: E2E Tests against Staging
    runs-on: ubuntu-latest
    needs: [deploy-api, deploy-web]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          cd apps/web
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: cd apps/web && npx playwright test
        env:
          BASE_URL: https://staging.terahbank.com
          TEST_USER_PHONE: ${{ secrets.E2E_TEST_USER_PHONE }}
          TEST_USER_PASSWORD: ${{ secrets.E2E_TEST_USER_PASSWORD }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
