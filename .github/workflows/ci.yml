name: CI

on:
  pull_request:
    branches: [main, staging]

jobs:
  # ─── Backend ────────────────────────────────────────────────────────────────
  backend-lint-test:
    name: API — Lint, Type Check, Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: terahbank_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt

      - name: Install dependencies
        run: |
          cd apps/api
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: cd apps/api && ruff check .

      - name: Type check (mypy)
        run: cd apps/api && mypy modules/

      - name: Run unit tests + coverage
        run: |
          cd apps/api
          pytest tests/unit/ \
            --cov=modules \
            --cov-fail-under=80 \
            --cov-report=xml \
            -v
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/terahbank_test
          REDIS_URL: redis://localhost:6379/0
          JWT_PRIVATE_KEY_PATH: ./secrets/jwt_private.pem
          JWT_PUBLIC_KEY_PATH: ./secrets/jwt_public.pem
          APP_ENV: test

      - name: Run integration tests
        run: |
          cd apps/api
          alembic upgrade head
          pytest tests/integration/ -v
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/terahbank_test
          REDIS_URL: redis://localhost:6379/0
          JWT_PRIVATE_KEY_PATH: ./secrets/jwt_private.pem
          JWT_PUBLIC_KEY_PATH: ./secrets/jwt_public.pem
          APP_ENV: test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: apps/api/coverage.xml
          flags: backend

  # ─── Frontend (web + admin) ──────────────────────────────────────────────────
  frontend-lint-test:
    name: Web + Admin — Lint, Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install + lint web
        run: |
          cd apps/web
          npm ci
          npm run lint
          npm run type-check

      - name: Install + lint admin
        run: |
          cd apps/admin
          npm ci
          npm run lint
          npm run type-check

  # ─── Mobile ─────────────────────────────────────────────────────────────────
  mobile-lint:
    name: Mobile — Lint, Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: cd apps/mobile && npm ci

      - name: Lint
        run: cd apps/mobile && npm run lint

      - name: Type check
        run: cd apps/mobile && npx tsc --noEmit

  # ─── Security scan ──────────────────────────────────────────────────────────
  security-scan:
    name: Security — SAST + Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: SAST — Bandit (Python)
        run: |
          pip install bandit
          bandit -r apps/api/modules/ -ll

      - name: Dependency vulnerabilities (Python)
        run: |
          pip install safety
          cd apps/api && safety check -r requirements.txt
        continue-on-error: true   # Advisory only until we have a full dep audit pass

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Dependency vulnerabilities (Node)
        run: |
          cd apps/web && npm audit --audit-level=high
          cd apps/admin && npm audit --audit-level=high
          cd apps/mobile && npm audit --audit-level=high
        continue-on-error: true
