<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160">
  <defs>
    <linearGradient id="navyGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B1F4A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A3A7A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tealGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00B4D8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0096B4;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0B1F4A" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Shield Icon -->
  <g filter="url(#shadow1)">
    <!-- Shield body -->
    <path d="M20,18 L20,18 L70,18 L70,70 C70,95 45,110 45,110 C45,110 20,95 20,70 Z" fill="url(#navyGrad1)" rx="4"/>
    <!-- Teal accent bar on shield -->
    <rect x="20" y="18" width="50" height="8" rx="2" fill="url(#tealGrad1)"/>
    <!-- T letter in shield -->
    <rect x="33" y="40" width="24" height="5" rx="2" fill="white"/>
    <rect x="43" y="45" width="5" height="30" rx="2" fill="white"/>
    <!-- Small teal dot accent -->
    <circle cx="45" cy="95" r="4" fill="url(#tealGrad1)"/>
  </g>

  <!-- Wordmark -->
  <!-- T -->
  <text x="88" y="82" font-family="'Poppins', 'Segoe UI', sans-serif" font-weight="700" font-size="44" fill="#0B1F4A" letter-spacing="-1">Terah</text>
  <!-- Bank in teal -->
  <text x="88" y="82" font-family="'Poppins', 'Segoe UI', sans-serif" font-weight="700" font-size="44" fill="#0B1F4A" letter-spacing="-1">
    <tspan fill="#0B1F4A">Terah</tspan><tspan fill="#00B4D8">Bank</tspan>
  </text>

  <!-- Tagline -->
  <text x="89" y="104" font-family="'Roboto', 'Arial', sans-serif" font-weight="400" font-size="13" fill="#6B7A99" letter-spacing="2.5">SAVE. GROW. THRIVE</text>

  <!-- Teal underline accent -->
  <rect x="89" y="112" width="60" height="2.5" rx="1.5" fill="#00B4D8"/>
</svg>
