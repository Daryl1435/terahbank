<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" width="100" height="110">
  <defs>
    <linearGradient id="navyGradSym" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B1F4A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A3A7A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tealGradSym" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00B4D8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0096B4;stop-opacity:1" />
    </linearGradient>
    <filter id="shadowSym" x="-15%" y="-10%" width="130%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0B1F4A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Shield body -->
  <g filter="url(#shadowSym)">
    <path d="M10,8 L90,8 L90,62 C90,90 50,106 50,106 C50,106 10,90 10,62 Z" fill="url(#navyGradSym)"/>
    <!-- Teal accent bar at top -->
    <rect x="10" y="8" width="80" height="11" rx="3" fill="url(#tealGradSym)"/>
    <!-- T — horizontal bar -->
    <rect x="28" y="36" width="44" height="9" rx="3" fill="white"/>
    <!-- T — vertical bar -->
    <rect x="41" y="45" width="18" height="32" rx="3" fill="white"/>
    <!-- Teal dot at base -->
    <circle cx="50" cy="92" r="6" fill="url(#tealGradSym)"/>
  </g>
</svg>
